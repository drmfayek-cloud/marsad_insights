  page: HD
  tier: 2
  placement: Page
  name_en: Dispute response turnaround
  name_ar: مدة الرد على الاعتراضات
  def_en: Median working days from receipt of a dispute to the team's documented response.
  def_ar: الوسيط لعدد أيام العمل من استلام الاعتراض حتى رد الفريق الموثق.
  formula: MEDIAN(response date - received date), in working days
  unit: Days
  date_basis: Dispute response date
  counting_unit: Dispute
  source: F3 Hospital disputes tracker (template v0.1, placeholder)
