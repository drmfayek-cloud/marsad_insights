kpis:
- id: EX-01
  page: EX
  tier: 1
  placement: CFO page - headline tile
  name_en: Encounters reviewed
  name_ar: الحالات المراجعة
  def_en: Number of pre-authorization encounters the team reviewed in the period, as recorded in the daily intake (claims added once in daily
    scope).
  def_ar: عدد حالات الموافقة المسبقة التي راجعها الفريق خلال الفترة وفق سجل الاستلام اليومي، وتضاف المطالبات عند دخولها نطاق المراجعة اليومية.
  formula: 'SUM(Daily Intake: Reviewed)'
  unit: Count
  date_basis: Intake date
  counting_unit: Encounter
  source: F1 MARSAD Daily Record & Action Tracker v5.6 (.xlsm)
  source_columns: 'Daily Intake (header row 4): A Date received, D TPA, F Reviewed'
  status: Mapped
  refresh: Daily
  owner: KPMG medical review lead
  target: '-'
  caveat: Counts encounters screened against the flag rules. TPA name variants are normalised at upload through a mapping table.
  decisions: D-01, D-02, D-18
- id: EX-02
  page: EX
  tier: 1
  placement: CFO page - secondary row
  name_en: Review coverage
  name_ar: نسبة تغطية المراجعة
  def_en: Encounters reviewed as a share of encounters received.
  def_ar: نسبة الحالات المراجعة إلى إجمالي الحالات المستلمة.
  formula: 'SUM(Daily Intake: Reviewed) / SUM(Daily Intake: Volume received)'
  unit: '%'
  date_basis: Intake date
  counting_unit: Encounter
  source: F1 MARSAD Daily Record & Action Tracker v5.6 (.xlsm)
  source_columns: 'Daily Intake: E Volume received, F Reviewed (H Coverage %)'
  status: Mapped
  refresh: Daily
  owner: KPMG medical review lead
  target: 100%
  caveat: 'Replaces capacity utilisation on the CFO page (D-18): the register counts screened encounters (568 a day in September), so a 100-a-day
    capacity would read as 500%+ utilisation.'
  decisions: D-10, D-18
- id: EX-03
  page: EX
  tier: 1
  placement: CFO page - headline tile
  name_en: Finding rate
  name_ar: نسبة الحالات ذات الملاحظات
  def_en: Share of reviewed encounters with at least one confirmed flag.
  def_ar: نسبة الحالات المراجعة التي سجل الفريق عليها ملاحظة مؤكدة واحدة على الأقل.
  formula: COUNT(distinct Reference no. with Flag status = Confirmed) / EX-01
  unit: '%'
  date_basis: Date logged
  counting_unit: Encounter
  source: F1 MARSAD Daily Record & Action Tracker v5.6 (.xlsm)
  source_columns: 'Daily Log (header row 4): E Reference no., K Flag status, B Date logged; Daily Intake: F Reviewed'
  status: Mapped
  refresh: Daily
  owner: KPMG medical review lead
  target: '-'
  caveat: A reference with several flags counts once. Encounters are screened against risk rules, so this is not an error rate for all approvals.
    October 2026 to date reads 0.8% against 6.6% in September, which points to flags not yet logged; check before publishing.
  decisions: D-02, D-08
- id: EX-04
  page: EX
  tier: 1
  placement: CFO page - headline tile
  name_en: Value at issue - pre-authorization
  name_ar: القيمة محل الملاحظة - الموافقات المسبقة
  def_en: SAR amount at risk on pre-authorization encounters with at least one confirmed flag.
  def_ar: القيمة بالريال المعرضة للمخاطر في حالات الموافقة المسبقة التي تحمل ملاحظة مؤكدة واحدة على الأقل.
  formula: SUM over distinct references of MAX(Amount at risk) where Flag status = Confirmed
  unit: SAR
  date_basis: Date logged
  counting_unit: Encounter
  source: F1 MARSAD Daily Record & Action Tracker v5.6 (.xlsm)
  source_columns: 'Daily Log: E Reference no., K Flag status, N Amount at risk (SAR), B Date logged'
  status: Mapped
  refresh: Daily
  owner: KPMG medical review lead
  target: '-'
  caveat: 'Amount at risk is the estimated or approved value of the flagged encounter, not a computed disallowance. Counted once per reference
    (D-19): summing every flag overstates the value by about 10% (SAR 105.5M vs 95.6M, Sep-Oct 2026). Potential cost avoidance at the Identified
    stage.'
  decisions: D-03, D-04, D-05, D-19
- id: EX-05
  page: EX
  tier: 1
  placement: CFO page - headline tile
  name_en: Value at issue - claims
  name_ar: القيمة محل الملاحظة - المطالبات
  def_en: SAR value at issue on claims reviewed through GSS pre-payment assurance; daily claims review is added once in scope.
  def_ar: القيمة بالريال محل الملاحظة في المطالبات المراجعة ضمن ضمان GSS قبل الصرف، وتضاف قيمة المراجعة اليومية للمطالبات عند دخولها النطاق.
  formula: GS-05 (+ daily claims value at issue when available, overlapping claims counted once)
  unit: SAR
  date_basis: Review date
  counting_unit: Claim
  source: F2 MARSAD GSS Assurance Workbook (.xlsm)
  source_columns: 'GSS workbook - Sample Register: Y Amount at issue (see GS-05)'
  status: Mapped
  refresh: Daily
  owner: KPMG medical review lead
  target: '-'
  caveat: The daily register holds pre-authorization flags only today (D-20). Identified stage; recovery is not confirmed.
  decisions: D-03, D-04, D-17, D-20
- id: EX-06
  page: EX
  tier: 1
  placement: CFO page - headline tile
  name_en: Findings sent to TPAs
  name_ar: الملاحظات المرسلة إلى شركات إدارة المطالبات
  def_en: Number and SAR amount at risk of confirmed flags routed to TPAs in the period.
  def_ar: عدد الملاحظات المؤكدة المحالة إلى شركات إدارة المطالبات خلال الفترة وقيمتها المعرضة للمخاطر بالريال.
  formula: COUNT and SUM(amount, once per reference) of confirmed flags with Action level = TPA level and a shared-with-TPA date in period
  unit: Count / SAR
  date_basis: Shared-with-TPA date
  counting_unit: Finding
  source: F1 MARSAD Daily Record & Action Tracker v5.6 (.xlsm)
  source_columns: 'Daily Log: M Action level, K Flag status, N Amount at risk; new column ''Shared with TPA on'''
  status: Needs new column
  refresh: Daily
  owner: KPMG medical review lead
  target: '-'
  caveat: Action level identifies TPA-level flags today; the date each flag is shared with the TPA (through the Share sheets) needs its own column.
    Responses and recoveries are not captured yet.
  decisions: D-03, D-09
- id: EX-07
  page: EX
  tier: 1
  placement: CFO page - headline tile
  name_en: Hospital disputes closed
  name_ar: اعتراضات المستشفيات المغلقة
  def_en: Number of hospital disputes the team closed with a documented response in the period.
  def_ar: عدد اعتراضات المستشفيات التي أغلقها الفريق برد موثق خلال الفترة.
  formula: COUNT(disputes with closure date in period)
  unit: Count
  date_basis: Dispute closure date
  counting_unit: Dispute
  source: F3 Hospital disputes tracker (template v0.1, placeholder)
  source_columns: 'Disputes: Closure date, Status'
  status: Needs new source
  refresh: Weekly
  owner: KPMG medical review lead
  target: '-'
  caveat: Additional workload outside the daily review scope. The tile carries dispute effort in hours (HD-07) as a sub-line.
  decisions: D-06, D-15
- id: EX-08
  page: EX
  tier: 1
  placement: CFO page - secondary row
  name_en: Review position maintained in disputes
  name_ar: نسبة ثبات موقف المراجعة في الاعتراضات
  def_en: Share of closed disputes in which the original review position was fully maintained.
  def_ar: نسبة الاعتراضات المغلقة التي ثبت فيها موقف المراجعة الأصلي بالكامل.
  formula: Closed disputes with outcome = Maintained / EX-07
  unit: '%'
  date_basis: Dispute closure date
  counting_unit: Dispute
  source: F3 Hospital disputes tracker (template v0.1, placeholder)
  source_columns: 'Disputes: Outcome, Closure date'
  status: Needs new source
  refresh: Weekly
  owner: KPMG medical review lead
  target: '-'
  caveat: Supports evidence of review quality. Partial outcomes are shown in HD-04.
  decisions: D-06, D-10
- id: EX-09
  page: EX
  tier: 1
  placement: CFO page - secondary row
  name_en: GSS assurance reports issued
  name_ar: تقارير ضمان GSS الصادرة
  def_en: Number of GSS for which the team issued an assurance report in the period, and the claimed value they cover.
  def_ar: عدد ملفات GSS التي أصدر الفريق تقرير ضمان عنها خلال الفترة، والقيمة المطالب بها التي تغطيها.
  formula: COUNT(GSS with report issued date in period); SUM(claimed SAR) of those GSS
  unit: Count / SAR
  date_basis: Report issued date
  counting_unit: GSS
  source: F2 MARSAD GSS Assurance Workbook (.xlsm)
  source_columns: 'GSS Register: T Status, AK Report issued date, M Claimed (SAR)'
  status: Mapped
  refresh: Per GSS
  owner: KPMG GSS assurance lead
  target: '-'
  caveat: Shown with the share of issued reports rated Unsatisfactory (GS-01). Claimed value covered is not value at issue.
  decisions: D-10, D-13
- id: EX-10
  page: EX
  tier: 1
  placement: CFO page - headline tile
  name_en: Deliverables submitted on time
  name_ar: نسبة المخرجات المسلمة في موعدها
  def_en: Share of contractual deliverables due in the period that were submitted on or before the due date.
  def_ar: نسبة المخرجات التعاقدية المستحقة خلال الفترة التي سلمها الفريق في موعدها أو قبله.
  formula: Deliverables submitted on or before due date / deliverables due
  unit: '%'
  date_basis: Due date
  counting_unit: Deliverable
  source: F5 Governance register (new)
  source_columns: ''
  status: Needs new source
  refresh: Monthly
  owner: KPMG engagement manager
  target: 100%
  caveat: Counts submission, not CNHI approval (see GV-02).
  decisions: D-10
- id: DR-01
  page: DR
  tier: 2
  placement: Page
  name_en: Daily review throughput
  name_ar: الإنتاجية اليومية للمراجعة
  def_en: Cases reviewed per working day, shown as a daily trend.
  def_ar: عدد الحالات المراجعة في كل يوم عمل، معروضا كاتجاه يومي.
  formula: 'SUM(Daily Intake: Reviewed) per intake day; per reviewer from the Daily Review Log'
  unit: Count per day
  date_basis: Intake date
  counting_unit: Encounter
  source: F1 MARSAD Daily Record & Action Tracker v5.6 (.xlsm)
  source_columns: 'Daily Intake: A Date received, F Reviewed; Daily Review Log: A Date, E Records reviewed'
  status: Mapped
  refresh: Daily
  owner: KPMG medical review lead
  target: To set after D-18
  caveat: Non-working days excluded from the trend.
  decisions: D-18
- id: DR-02
  page: DR
  tier: 2
  placement: Page
  name_en: Review backlog
  name_ar: الحالات المتراكمة قيد المراجعة
  def_en: Encounters received and not yet reviewed at period end, per the daily intake.
  def_ar: الحالات المستلمة التي لم تكتمل مراجعتها بنهاية الفترة وفق سجل الاستلام اليومي.
  formula: 'SUM(Daily Intake: Outstanding) at period end'
  unit: Count
  date_basis: Intake date
  counting_unit: Encounter
  source: F1 MARSAD Daily Record & Action Tracker v5.6 (.xlsm)
  source_columns: 'Daily Intake: G Outstanding'
  status: Mapped
  refresh: Daily
  owner: KPMG medical review lead
  target: '-'
  caveat: Intake is recorded per day, source and TPA.
  decisions: D-01
- id: DR-03
  page: DR
  tier: 2
  placement: Page
  name_en: Review turnaround
  name_ar: مدة إنجاز المراجعة
  def_en: Median working days from receipt of a case to completion of its review.
  def_ar: الوسيط لعدد أيام العمل من استلام الحالة حتى إنجاز مراجعتها.
  formula: MEDIAN(review completion date - received date), in working days
  unit: Days
  date_basis: Review completion date
  counting_unit: Case
  source: F1 MARSAD Daily Record & Action Tracker v5.6 (.xlsm)
  source_columns: 'New columns: received and reviewed timestamps per encounter'
  status: Needs new column
  refresh: Daily
  owner: KPMG medical review lead
  target: '-'
  caveat: The daily intake is aggregated per day; turnaround needs received and reviewed timestamps per encounter.
  decisions: D-01
- id: DR-04
  page: DR
  tier: 2
  placement: Page
  name_en: Findings by flag family
  name_ar: الملاحظات حسب عائلة الملاحظة
  def_en: Number and SAR amount at risk of confirmed flags by flag family (eligibility, emergency qualification, triage, benefit and duration,
    documentation, provider and channel, data quality, claims, turnaround).
  def_ar: عدد الملاحظات المؤكدة وقيمتها المعرضة للمخاطر بالريال حسب عائلة الملاحظة، مثل الأهلية واستحقاق الطوارئ وسلامة الفرز والمنفعة والمدة
    والتوثيق ومقدم الخدمة وقناة التقديم وجودة البيانات والمطالبات وزمن الإنجاز.
  formula: COUNT and SUM(amount at risk) of confirmed flags grouped by flag family (prefix of Flag code)
  unit: Count / SAR
  date_basis: Date logged
  counting_unit: Flag
  source: F1 MARSAD Daily Record & Action Tracker v5.6 (.xlsm)
  source_columns: 'Daily Log: H Flag code (family = prefix), K Flag status, N Amount at risk; Config: A Flag code, B-C Flag type EN/AR'
  status: Mapped
  refresh: Daily
  owner: KPMG medical review lead
  target: '-'
  caveat: The daily register uses its own 35 flag codes in 9 families (DIM-22); GSS uses the MARSAD finding categories (DIM-05).
  decisions: D-02
- id: DR-05
  page: DR
  tier: 2
  placement: Page
  name_en: Outlier cases below SAR 50k
  name_ar: الحالات الشاذة دون 50 ألف ريال
  def_en: Number of cases below SAR 50,000 selected for review because they were outliers, and their finding rate.
  def_ar: عدد الحالات التي تقل قيمتها عن 50 ألف ريال واختارها الفريق للمراجعة لأنها حالات شاذة، ونسبة الملاحظات عليها.
  formula: COUNT(cases with selection reason = outlier below SAR 50k); finding rate as in EX-03
  unit: Count / %
  date_basis: Review completion date
  counting_unit: Case
  source: F1 MARSAD Daily Record & Action Tracker v5.6 (.xlsm)
  source_columns: 'New column in Daily Log: ''Selection reason'''
  status: Needs new column
  refresh: Daily
  owner: KPMG medical review lead
  target: '-'
  caveat: Policy applies from October 2026; earlier months show none by design.
  decisions: D-08
- id: DR-06
  page: DR
  tier: 3
  placement: Drill-down
  name_en: Value at issue per reviewed case
  name_ar: القيمة محل الملاحظة لكل حالة مراجعة
  def_en: 'Average SAR value at issue per case reviewed: the yield of the review effort.'
  def_ar: متوسط القيمة محل الملاحظة لكل حالة مراجعة، ويعبر عن عائد جهد المراجعة.
  formula: EX-04 / EX-01 (pre-authorization); GS-05 / GSS claims reviewed (claims)
  unit: SAR
  date_basis: Review completion date
  counting_unit: Case
  source: F1 MARSAD Daily Record & Action Tracker v5.6 (.xlsm)
  source_columns: Derived from EX-04, EX-01, GS-05
  status: Mapped
  refresh: Daily
  owner: KPMG medical review lead
  target: '-'
  caveat: Show by pathway; never add pre-authorization and claims values into one headline.
  decisions: D-04
- id: DR-07
  page: DR
  tier: 3
  placement: Drill-down
  name_en: Provider concentration
  name_ar: تركز الملاحظات لدى مقدمي الخدمة
  def_en: Share of total value at issue attributable to the ten providers with the highest value at issue.
  def_ar: حصة أعلى عشرة مقدمي خدمة من إجمالي القيمة محل الملاحظة.
  formula: SUM(value at issue, top 10 providers) / SUM(value at issue, all providers)
  unit: '%'
  date_basis: Date logged
  counting_unit: Finding
  source: F1 MARSAD Daily Record & Action Tracker v5.6 (.xlsm)
  source_columns: 'Daily Log: G Provider, N Amount at risk, E Reference no.'
  status: Mapped
  refresh: Monthly
  owner: KPMG medical review lead
  target: '-'
  caveat: High concentration supports targeted provider engagement. Provider names appear on management pages only.
  decisions: D-12
- id: DR-08
  page: DR
  tier: 2
  placement: Page
  name_en: Evidence traceability
  name_ar: اكتمال التوثيق والأدلة
  def_en: Share of findings in the register with a recorded evidence reference (document, page or rule).
  def_ar: نسبة الملاحظات المسجلة في السجل التي تتضمن مرجعا موثقا للدليل، مثل المستند أو الصفحة أو القاعدة.
  formula: Findings with evidence reference / all findings
  unit: '%'
  date_basis: Review completion date
  counting_unit: Finding
  source: F1 MARSAD Daily Record & Action Tracker v5.6 (.xlsm)
  source_columns: 'New column in Daily Log: ''Evidence reference'''
  status: Needs new column
  refresh: Daily
  owner: KPMG engagement manager
  target: 100%
  caveat: Flag description holds the rule text, not the evidence reference; add an 'Evidence reference' column to the Daily Log.
  decisions: ''
