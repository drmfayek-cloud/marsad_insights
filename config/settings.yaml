# MARSAD Insights - settings you may edit. Restart the service after a change.

# TPA name variants found in the workbooks -> the one name shown on the dashboard (match is case-insensitive).
# Add a line when a new spelling appears in an upload warning.
tpa_names:
  globemed: GlobeMed Saudi
  globemed saudi: GlobeMed Saudi
  nextcare: NextCare
  next care: NextCare
  tcs: TCS
  totalcare: Totalcare

# Flag families of the daily register (prefix of the flag code)
flag_families:
  ELG: {en: Eligibility, ar: الأهلية}
  EMG: {en: Emergency qualification, ar: استحقاق الطوارئ}
  TRG: {en: Triage integrity, ar: سلامة الفرز}
  PRV: {en: Provider and channel, ar: مقدم الخدمة وقناة التقديم}
  BEN: {en: Benefit and duration, ar: المنفعة والمدة}
  TAT: {en: Turnaround, ar: زمن الإنجاز}
  DOC: {en: Documentation, ar: التوثيق}
  CLM: {en: Claims, ar: المطالبات}
  DQ: {en: Data quality, ar: جودة البيانات}

# Working week (Decision D-07): Sunday to Thursday. Python weekday numbers: Monday=0 ... Sunday=6.
weekend_days: [4, 5]

# Outlier rule for DR-05 (Selection reason column in the daily register)
outlier_threshold_sar: 50000
outlier_keyword: outlier

# GSS checkpoints treated as critical (from the GSS Assurance Workbook Checklist Guide)
gss_critical: [K1, K2, K3, K4]

# Dispute ageing bands for HD-02 (days since receipt)
dispute_age_bands: [5, 10, 20]

# Corrective-action tracker (Governance page). Status is calculated, never typed.
corrective_actions:
  due_soon_days: 7        # open actions due within this many days show as 'Due soon' (amber)
  stale_days: 7           # warn when the F6 register has not been uploaded for longer than this
  status_note_max: 200    # characters kept from the status note
  # Corrective actions are built from the registers (1.8): Daily Log flags grouped by TPA or provider, flag family and month;
  # GSS claim flags per GSS report; disputes with a fraud, waste or abuse indicator per hospital and indicator.
  closed_statuses: [Closed, Resolved, Recovered, Completed, Done, مغلق, مغلقة, منجز]   # Daily Log 'Status' values that close a flag
  provider_keywords: [provider, hospital, facility, مقدم, مستشفى]                     # 'Action level' values aimed at a provider
  provider_top_per_month: 10      # provider actions kept per month (largest by amount at risk)
  provider_min_flags: 3           # ... with at least this many confirmed flags
  provider_min_sar: 100000        # ... or at least this amount at risk
