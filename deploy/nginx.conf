# Reverse proxy for MARSAD Insights on an in-Kingdom server. Replace insights.example.sa and the certificate paths.
server {
    listen 80;
    server_name insights.example.sa;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name insights.example.sa;
    ssl_certificate     /etc/letsencrypt/live/insights.example.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insights.example.sa/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 40m;            # largest workbook upload
    # Optional: restrict to CNHI and KPMG networks
    # allow 10.0.0.0/8; deny all;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
